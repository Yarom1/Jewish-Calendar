name: Build Debug APK

on:
  push:
    branches:
      - claude/jewish-calendar-android-app-ocf673
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jewish-calendar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-apk
          name: Latest debug APK
          body: Automated debug build from ${{ github.sha }}. Not for production use.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/*.apk
